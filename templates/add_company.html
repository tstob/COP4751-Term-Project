<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company</title>
</head>
<body>

    <h1>Add New Company</h1>

    <form method="POST">

        <label>Company Name:</label>
        <input type="text" name="company_name" maxlength="100" required>
        <br><br>

        <label>Industry:</label>
        <input type="text" name="industry" maxlength="50">
        <br><br>

        <label>City:</label>
        <input type="text" name="city" maxlength="50">
        <br><br>

        <label>State:</label>
        <input type="text" name="state" maxlength="50">
        <br><br>

        <button type="submit">Save Company</button>

    </form>

    <p><a href="/companies">Back to Companies</a></p>

</body>
</html>
