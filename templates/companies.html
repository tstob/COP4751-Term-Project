<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Companies</h1>

    <a href="/">Back to Dashboard</a>

    <p><a href="/companies/add">Add New Company</a></p>

    <h2>Company List</h2>

    <table border="1">
        <tr>
            <th>Company Name</th>
            <th>Industry</th>
            <th>City</th>
            <th>State</th>
            <th>Actions</th>
        </tr>

        {% for company in companies %}
        <tr>
            <td>{{ company.company_name }}</td>
            <td>{{ company.industry }}</td>
            <td>{{ company.city }}</td>
            <td>{{ company.state }}</td>            
            <td>
                <!-- Edit company -->
                <a href="{{ url_for('edit_company', company_id=company.company_id) }}">
                    Edit
                </a>

                <!-- Delete company -->
                <form action="{{ url_for('delete_company', company_id=company.company_id) }}"
                    method="POST"
                    style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to delete this company?');">

                    <button type="submit">Delete</button>

                </form>
            </td>

        </tr>
        {% endfor %}

    </table>

</body>
</html>
