<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="dashboard">

        <h1>Job Application Tracker</h1>
        <h2>Dashboard</h2>

        <!-- horizontal -->
        <div class="dashboard-totals">

            <div>
                <h3>{{ counts.companies }}</h3>
                <p>Companies</p>
            </div>

            <div>
                <h3>{{ counts.jobs }}</h3>
                <p>Jobs</p>
            </div>

            <div>
                <h3>{{ counts.applications }}</h3>
                <p>Applications</p>
            </div>

            <div>
                <h3>{{ counts.contacts }}</h3>
                <p>Contacts</p>
            </div>

        </div>

        <!-- separate -->
        <hr>

        <!-- vertical -->
        <nav class="dashboard-nav">

            <p><a href="/companies">View Companies</a></p>

            <p><a href="/jobs">View Jobs</a></p>

            <p><a href="/applications">View Applications</a></p>

            <p><a href="/contacts">View Contacts</a></p>

            <p><a href="{{ url_for('job_match') }}">Match Jobs</a></p>

        </nav>

    </div>

</body>
</html>
